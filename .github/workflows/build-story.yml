name: Build Story JPEG
on:
  push:
    paths:
      - 'hikaye.svg'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to JPEG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
          rsvg-convert -w 1080 -h 1920 hikaye.svg -o /tmp/hikaye.png
          convert /tmp/hikaye.png -quality 90 hikaye.jpg
      - name: Commit JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hikaye.jpg
          git diff --cached --quiet || git commit -m "Build Instagram story JPEG"
          git push
